# Project-local RTK filters for the RTK project itself.
schema_version = 1

# Cargo check/clippy: drop noise, keep errors and warnings
[filters.cargo-check-rtk]
description = "Compact cargo check/clippy for RTK"
match_command = "^cargo\\s+(check|clippy)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*Compiling\\s",
  "^\\s*Finished\\s",
  "^\\s*Blocking\\s",
  "^\\s*Downloading\\s",
  "^\\s*Updating\\s",
  "^\\s*$",
]
max_lines = 60
on_empty = "cargo check: ok"

[[tests.cargo-check-rtk]]
name = "strips compiling lines"
input = "   Compiling rtk v0.37.1\nwarning: unused import\n   Finished dev"
expected = "warning: unused import"

# Cargo test: keep only failures and summary
[filters.cargo-test-rtk]
description = "Compact cargo test for RTK — failures and summary only"
match_command = "^cargo\\s+test\\b"
strip_ansi = true
keep_lines_matching = [
  "^(FAILED|error\\[|test result|failures:|thread ')",
  "^cargo test:",
]
on_empty = "cargo test: all passed"
max_lines = 50

[[tests.cargo-test-rtk]]
name = "keeps failure lines"
input = "test foo ... ok\ntest bar ... FAILED\ntest result: FAILED. 1 failed"
expected = "test bar ... FAILED\ntest result: FAILED. 1 failed"
